name: Compilar RIGGO Demo APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/compilar-apk-demo.yml'
permissions:
  contents: read
jobs:
  compilar-apk:
    name: Android debug APK API 35
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Verificar archivo de salida
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RIGGO-DEMO-APK-API35
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
